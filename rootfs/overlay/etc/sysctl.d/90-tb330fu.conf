# TB330FU: the root is an eMMC (HS400, ~230 MB/s sequential, slow fsync) and the machine has 8 GB of RAM.  With the defaults (dirty_ratio 20 % / background 10 %) up to
# 1.5 GB of dirty pages pile up during an apt install or a download and are then written in one go: every fsync() of every other program (gnome-shell, dconf,
# sqlite databases of the apps) waits behind that burst and the desktop freezes.  Start writeback early and cap the dirty data.
vm.dirty_background_bytes = 33554432
vm.dirty_bytes = 134217728
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 300
# swap lives in zram (tb330fu-zram.service), which is cheap: swap eagerly, one page at a time
vm.swappiness = 100
vm.page-cluster = 0
